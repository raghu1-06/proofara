<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Wax seal radial gradient -->
    <radialGradient id="sealRed" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#c1442e"/>
      <stop offset="55%" stop-color="#7a1a0a"/>
      <stop offset="100%" stop-color="#3d0a04"/>
    </radialGradient>
    <!-- Gold ring gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeed1"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#664604"/>
    </linearGradient>
  </defs>

  <!-- Wax seal irregular outer disk -->
  <path d="M50 4 C72 4 94 20 96 46 C98 74 76 96 48 96 C22 96 4 76 4 50 C4 24 24 4 50 4 Z" fill="url(#sealRed)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))"/>
  
  <!-- Inner debossed ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#faeed1" stroke-width="0.8" opacity="0.5"/>

  <!-- Heritage Castle Crest / Tower Gateway -->
  <path d="M34 68 L34 44 L40 44 L40 38 L46 38 L46 44 L54 44 L54 38 L60 38 L60 44 L66 44 L66 68 Z" fill="#faeed1" opacity="0.95"/>
  <!-- Gateway Arch -->
  <path d="M44 68 L44 54 C44 50 56 50 56 54 L56 68 Z" fill="#3d0a04"/>
  <!-- Central Spire / Pennant -->
  <polygon points="50,22 56,36 44,36" fill="#b8860b"/>
</svg>